# Runs schema creation and one-time seed data once as a Kubernetes Job so
# task-org-webapp pods never execute DDL/DML on the cold-start critical path
# (the Deployment sets SPRING_SQL_INIT_MODE=never).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: task-org
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS projects (
        id BIGSERIAL PRIMARY KEY,
        name VARCHAR(200) NOT NULL,
        description TEXT,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS tasks (
        id BIGSERIAL PRIMARY KEY,
        project_id BIGINT NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
        title VARCHAR(300) NOT NULL,
        completed BOOLEAN NOT NULL DEFAULT FALSE,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS app_seed_history (
        seed_name VARCHAR(100) PRIMARY KEY,
        applied_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
  data.sql: |
    INSERT INTO projects (name, description)
    SELECT 'Zero-Scale Article', 'Demo tasks for the KEDA + Project Leyden zero-scale article'
    WHERE NOT EXISTS (SELECT 1 FROM app_seed_history WHERE seed_name = 'initial-seed');

    INSERT INTO projects (name, description)
    SELECT 'Personal Errands', 'Everyday tasks organized by project'
    WHERE NOT EXISTS (SELECT 1 FROM app_seed_history WHERE seed_name = 'initial-seed');

    INSERT INTO tasks (project_id, title, completed)
    SELECT p.id, 'Set up k3d cluster with Traefik and KEDA', true
    FROM projects p
    WHERE p.name = 'Zero-Scale Article'
      AND NOT EXISTS (SELECT 1 FROM app_seed_history WHERE seed_name = 'initial-seed');

    INSERT INTO tasks (project_id, title, completed)
    SELECT p.id, 'Benchmark Project Leyden AOT cold start', false
    FROM projects p
    WHERE p.name = 'Zero-Scale Article'
      AND NOT EXISTS (SELECT 1 FROM app_seed_history WHERE seed_name = 'initial-seed');

    INSERT INTO tasks (project_id, title, completed)
    SELECT p.id, 'Pick up coffee beans', false
    FROM projects p
    WHERE p.name = 'Personal Errands'
      AND NOT EXISTS (SELECT 1 FROM app_seed_history WHERE seed_name = 'initial-seed');

    INSERT INTO app_seed_history (seed_name)
    SELECT 'initial-seed'
    WHERE NOT EXISTS (SELECT 1 FROM app_seed_history WHERE seed_name = 'initial-seed');
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: task-org
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql-init
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-secret
          command:
            - sh
            - -eu
            - -c
            - |
              export PGHOST=postgres
              export PGUSER="${POSTGRES_USER}"
              export PGDATABASE="${POSTGRES_DB}"
              export PGPASSWORD="${POSTGRES_PASSWORD}"
              until pg_isready -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}"; do
                sleep 1
              done
              psql -v ON_ERROR_STOP=1 --single-transaction -f /sql/schema.sql
              psql -v ON_ERROR_STOP=1 --single-transaction -f /sql/data.sql
          volumeMounts:
            - name: init-sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
