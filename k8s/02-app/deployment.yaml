apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-org-webapp
  namespace: task-org
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-org-webapp
  template:
    metadata:
      labels:
        app: task-org-webapp
    spec:
      containers:
        - name: task-org-webapp
          image: task-org-webapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/taskorg
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:AOTCache=app.aot"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
