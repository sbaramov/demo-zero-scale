spring:
  application:
    name: task-org-webapp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskorg}
    username: ${DB_USERNAME:taskorg}
    password: ${DB_PASSWORD:taskorg}
  mvc:
    servlet:
      load-on-startup: 1
  sql:
    init:
      mode: always

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
