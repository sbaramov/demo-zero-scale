<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Organizer — Zero-Scale Spring Boot Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Task Organizer</span>
        <span class="navbar-text text-secondary small">Spring Boot 4.1 &middot; Java 25 Leyden AOT &middot; Traefik + KEDA</span>
    </div>
</nav>

<main class="container">
    <div id="error-banner" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-4">
        <section class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">Projects</div>
                <div class="card-body">
                    <form id="project-form" class="mb-3">
                        <div class="mb-2">
                            <input id="project-name" type="text" class="form-control form-control-sm"
                                   placeholder="New project name" required>
                        </div>
                        <div class="mb-2">
                            <input id="project-description" type="text" class="form-control form-control-sm"
                                   placeholder="Short description (optional)">
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100">Add Project</button>
                    </form>
                    <div id="project-list" class="list-group"></div>
                </div>
            </div>
        </section>

        <section class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <span id="selected-project-name" class="fw-semibold">Select a project</span>
                        <div id="selected-project-description" class="text-muted small"></div>
                    </div>
                    <button id="delete-project-btn" class="btn btn-outline-danger btn-sm d-none" type="button">
                        Delete Project
                    </button>
                </div>
                <div class="card-body">
                    <form id="task-form" class="input-group mb-3 d-none">
                        <input id="task-title" type="text" class="form-control" placeholder="Add a new task..." required>
                        <button type="submit" class="btn btn-success">Add</button>
                    </form>
                    <ul id="task-list" class="list-group list-group-flush"></ul>
                    <p id="empty-tasks-msg" class="text-muted small mb-0 d-none">No tasks yet. Add one above.</p>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="/app.js"></script>
</body>
</html>
