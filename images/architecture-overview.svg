<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548">
  <defs>
    <style>
      .font { font-family: 'Noto Sans', 'Liberation Sans', 'DejaVu Sans', sans-serif; }
      .mono { font-family: 'Noto Mono', 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
    </style>
    <filter id="shadow" x="-6%" y="-8%" width="112%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="softShadow">
        <feFuncA type="linear" slope="0.10"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="softShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Clean white background -->
  <rect x="0" y="0" width="960" height="548" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="24" y="34" class="font" font-size="20" font-weight="700" fill="#0F172A">Zero-Scale Architecture on Local k3d Cluster</text>
  <text x="24" y="54" class="font" font-size="12.5" fill="#64748B">Every HTTP request flows through the KEDA Interceptor; only task-org-webapp scales between 0 and 5 replicas</text>

  <!-- Kubernetes Cluster Outer Container -->
  <rect x="214" y="82" width="722" height="442" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7,5"/>
  <!-- Cluster Pill Label on Top Border -->
  <rect x="232" y="69" width="236" height="26" rx="13" fill="#0F172A"/>
  <text x="350" y="86.5" class="font" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kubernetes Cluster (k3d / k3s)</text>

  <!-- ================= OUTSIDE CLUSTER (LEFT) ================= -->

  <!-- Client Box -->
  <g filter="url(#shadow)">
    <rect x="24" y="146" width="158" height="82" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="36" y="156" width="54" height="18" rx="9" fill="#F1F5F9"/>
    <text x="63" y="168.5" class="font" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">CLIENT</text>
    <text x="103" y="194" class="font" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Browser / curl</text>
    <text x="103" y="213" class="mono" font-size="11.5" fill="#475569" text-anchor="middle">localhost:8008</text>
  </g>

  <!-- Arrow: Client -> k3d LoadBalancer -->
  <line x1="103" y1="228" x2="103" y2="271" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="112" y="254" class="mono" font-size="10.5" fill="#475569">HTTP :8008</text>

  <!-- k3d LoadBalancer Box -->
  <g filter="url(#shadow)">
    <rect x="24" y="274" width="158" height="82" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="36" y="284" width="44" height="18" rx="9" fill="#F1F5F9"/>
    <text x="58" y="296.5" class="font" font-size="9.5" font-weight="700" fill="#475569" text-anchor="middle">EDGE</text>
    <text x="103" y="322" class="font" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle">k3d LoadBalancer</text>
    <text x="103" y="341" class="mono" font-size="11" fill="#475569" text-anchor="middle">8008 → 80</text>
  </g>

  <!-- Arrow: k3d LB -> Traefik Ingress -->
  <line x1="182" y1="315" x2="238" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="197" y="305" class="mono" font-size="10.5" fill="#475569" text-anchor="middle">:80</text>

  <!-- ================= INSIDE CLUSTER ================= -->

  <!-- KEDA External Scaler & Operator (Control Plane) -->
  <g filter="url(#shadow)">
    <rect x="498" y="114" width="292" height="82" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
    <rect x="512" y="124" width="106" height="18" rx="9" fill="#FEF3C7"/>
    <text x="565" y="136.5" class="font" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle">CONTROL PLANE</text>
    <rect x="734" y="124" width="44" height="18" rx="9" fill="#FDE68A"/>
    <text x="756" y="136.5" class="mono" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle">keda</text>
    <text x="644" y="164" class="font" font-size="14" font-weight="700" fill="#78350F" text-anchor="middle">KEDA External Scaler &amp; Operator</text>
    <text x="644" y="182" class="font" font-size="11.5" fill="#92400E" text-anchor="middle">Triggers scale-up &amp; cooldown scale-to-zero</text>
  </g>

  <!-- Traefik Ingress -->
  <g filter="url(#shadow)">
    <rect x="242" y="272" width="146" height="88" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
    <rect x="254" y="282" width="76" height="18" rx="9" fill="#E0E7FF"/>
    <text x="292" y="294.5" class="font" font-size="9.5" font-weight="700" fill="#4338CA" text-anchor="middle">k3s built-in</text>
    <text x="315" y="322" class="font" font-size="14" font-weight="700" fill="#1E1B4B" text-anchor="middle">Traefik Ingress</text>
    <text x="315" y="341" class="mono" font-size="10.8" fill="#4338CA" text-anchor="middle">Ingress / → :8080</text>
  </g>

  <!-- Arrow: Traefik -> KEDA Interceptor -->
  <line x1="388" y1="316" x2="420" y2="316" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- KEDA HTTP Interceptor Proxy -->
  <g filter="url(#shadow)">
    <rect x="424" y="266" width="196" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="436" y="277" width="44" height="18" rx="9" fill="#DBEAFE"/>
    <text x="458" y="289.5" class="mono" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">keda</text>
    <rect x="486" y="277" width="122" height="18" rx="9" fill="#DBEAFE"/>
    <text x="547" y="289.5" class="font" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">ALWAYS IN DATA PATH</text>
    <text x="522" y="317" class="font" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">KEDA HTTP Interceptor</text>
    <text x="522" y="334" class="font" font-size="13.5" font-weight="700" fill="#1E3A8A" text-anchor="middle">Proxy</text>
    <text x="522" y="354" class="font" font-size="11" fill="#1D4ED8" text-anchor="middle">Buffers requests while at 0</text>
  </g>

  <!-- Arrow: KEDA Interceptor -> App -->
  <line x1="620" y1="316" x2="664" y2="316" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="642" y="306" class="font" font-size="10.5" font-weight="600" fill="#1D4ED8" text-anchor="middle">HTTP</text>

  <!-- task-org-webapp Deployment -->
  <g filter="url(#shadow)">
    <rect x="668" y="266" width="246" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="680" y="277" width="66" height="18" rx="9" fill="#D1FAE5"/>
    <text x="713" y="289.5" class="mono" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">task-org</text>
    <rect x="752" y="277" width="96" height="18" rx="9" fill="#059669"/>
    <text x="800" y="289.5" class="font" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 ↔ 5 REPLICAS</text>
    <text x="791" y="318" class="mono" font-size="13.5" font-weight="700" fill="#064E3B" text-anchor="middle">task-org-webapp</text>
    <text x="791" y="336" class="font" font-size="11.5" fill="#065F46" text-anchor="middle">Deployment · Spring Boot 4.1</text>
    <text x="791" y="353" class="font" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">Java 25 + Project Leyden AOT</text>
  </g>

  <!-- Dashed Control Plane Arrows -->
  <!-- 1. Interceptor -> Scaler (UP) -->
  <line x1="554" y1="266" x2="554" y2="200" stroke="#D97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-amber)"/>
  <text x="544" y="229" class="font" font-size="11" font-weight="600" fill="#B45309" text-anchor="end">pending request metric</text>
  <text x="544" y="244" class="mono" font-size="10" fill="#92400E" text-anchor="end">(external-push)</text>

  <!-- 2. Scaler -> App (DOWN) -->
  <line x1="736" y1="196" x2="736" y2="262" stroke="#D97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-amber)"/>
  <text x="746" y="229" class="font" font-size="11" font-weight="600" fill="#B45309" text-anchor="start">scale 0 ↔ N</text>
  <text x="746" y="244" class="mono" font-size="10" fill="#92400E" text-anchor="start">via ScaledObject</text>

  <!-- Arrow: App -> PostgreSQL -->
  <line x1="791" y1="366" x2="791" y2="412" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="801" y="394" class="mono" font-size="10.5" fill="#475569">JDBC :5432</text>

  <!-- PostgreSQL StatefulSet Cylinder -->
  <g filter="url(#shadow)">
    <!-- Cylinder Body -->
    <path d="M 684 428 L 684 494 A 107 14 0 0 0 898 494 L 898 428 Z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
    <!-- Cylinder Top Ellipse -->
    <ellipse cx="791" cy="428" rx="107" ry="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
    <text x="791" y="462" class="font" font-size="13.5" font-weight="700" fill="#4C1D95" text-anchor="middle">PostgreSQL StatefulSet</text>
    <text x="791" y="481" class="font" font-size="11.5" fill="#5B21B6" text-anchor="middle">1 replica (always on) + 1Gi PVC</text>
  </g>

  <!-- Legend Box (bottom-left inside cluster) -->
  <rect x="242" y="404" width="388" height="104" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="256" y="423" class="font" font-size="10.5" font-weight="700" fill="#64748B" letter-spacing="0.5">LEGEND</text>

  <!-- Legend Row 1 -->
  <line x1="256" y1="441" x2="292" y2="441" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="304" y="445" class="font" font-size="11.5" fill="#334155">HTTP data path (always via KEDA Interceptor)</text>

  <!-- Legend Row 2 -->
  <line x1="256" y1="464" x2="292" y2="464" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="304" y="468" class="font" font-size="11.5" fill="#334155">Edge ingress &amp; direct PostgreSQL JDBC traffic</text>

  <!-- Legend Row 3 -->
  <line x1="256" y1="487" x2="292" y2="487" stroke="#D97706" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="304" y="491" class="font" font-size="11.5" fill="#334155">KEDA control signal (InterceptorRoute + ScaledObject)</text>
</svg>
